name: CICD pipeline for testing docker image

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    name: build api and run the tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code from current repo
        uses: actions/checkout@v4

      - name: Checkout spartanAPI repo
        uses: actions/checkout@v4
        with:
          repository: cs-taha123h/SpartanAPI
          ref: main
          path: SpartanAPI

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'
          cache: maven

      - name: Build docker image
        run: |
          docker build -t spartan-api ./SpartanAPI/SpartaAcademyAPI

      - name: Start container
        run: |
          docker run -d -p 8080:8080 -p 8081:8081 spartan-api

      - name: Wait for SpartanAPI
        run: |
          for i in {1..30}; do
            if curl -sS -o /dev/null http://localhost:8080; then
              echo "API is running!"
              exit 0
            fi

            echo "Waiting for API..."
            sleep 2
          done

          echo "API failed to start"
          docker logs spartan-api
          exit 1

      - name: Run maven tests
        run: mvn clean verify

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spartan-api-test-results
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/
            target/cucumber-reports/
          if-no-files-found: ignore

      - name: Stop API
        if: always()
        run: docker stop spartan-api || true
          
